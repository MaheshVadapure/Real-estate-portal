
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details | DreamHome Pune</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{background:#f5f7fb;color:#222;line-height:1.6}
    header{background:#10233f;color:white;padding:16px 7%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
    .logo{color:white;text-decoration:none;font-size:24px;font-weight:bold}
    .logo span{color:#ffb703}
    nav{display:flex;gap:18px;flex-wrap:wrap}
    nav a{color:white;text-decoration:none;font-size:14px}
    nav a:hover{color:#ffb703}
    .breadcrumb{width:90%;max-width:1150px;margin:22px auto;color:#687383;font-size:14px}
    .breadcrumb a{color:#24558a;text-decoration:none}
    .container{width:90%;max-width:1150px;margin:0 auto 50px}
    .property-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start}
    .image-placeholder{height:390px;border-radius:14px;background:linear-gradient(135deg,#dce8f5,#a9bfd9);display:flex;align-items:center;justify-content:center;text-align:center;color:#10233f;font-size:23px;font-weight:bold;padding:20px}
    .details-card,.description-card,.contact-card{background:white;border-radius:14px;padding:25px;box-shadow:0 5px 20px #0000000f}
    .property-type{display:inline-block;background:#e8f1ff;color:#24558a;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:bold;margin-bottom:12px}
    h1{color:#10233f;font-size:30px;line-height:1.3;margin-bottom:10px}
    .location{color:#687383;margin-bottom:18px}
    .price{color:#24558a;font-size:28px;font-weight:bold;margin-bottom:18px}
    .quick-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}
    .fact{background:#f5f7fb;padding:13px;border-radius:9px;overflow-wrap:anywhere}
    .fact span{display:block;color:#687383;font-size:13px}
    .fact strong{color:#10233f;font-size:15px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .btn{display:inline-block;padding:12px 16px;border-radius:7px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-size:14px;font-weight:bold;text-align:center}
    .btn-dark{background:#10233f;color:white}
    .btn-dark:hover{background:#24558a}
    .btn-outline{background:white;color:#10233f;border-color:#10233f}
    .btn-outline:hover{background:#edf4ff}
    .description-card,.contact-card{margin-top:25px}
    h2{color:#10233f;font-size:22px;margin-bottom:14px}
    .description-card p,.contact-card p{color:#606b78;margin-bottom:12px}
    .features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}
    .feature{padding:10px;border-radius:7px;background:#f5f7fb;color:#394657}
    .notice{font-size:13px;margin-top:12px}
    .not-found{background:white;border-radius:14px;padding:45px 20px;text-align:center;box-shadow:0 5px 20px #0000000f}
    .not-found p{color:#687383;margin:12px 0 20px}
    footer{background:#10233f;color:#dce5f0;text-align:center;padding:22px;font-size:14px}
    @media(max-width:800px){.property-layout{grid-template-columns:1fr}.image-placeholder{height:300px}h1{font-size:25px}.price{font-size:25px}}
    @media(max-width:500px){header{justify-content:center}nav{justify-content:center}.details-card,.description-card,.contact-card{padding:19px}.actions .btn{flex:1 1 100%}.features{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">DreamHome <span>Pune</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="properties.html">Properties</a>
      <a href="favorites.html">Favorites</a>
      <a href="contact-owner.html">Contact</a>
    </nav>
  </header>

  <div class="breadcrumb">
    <a href="index.html">Home</a> /
    <a href="properties.html">Properties</a> /
    <span>Property Details</span>
  </div>

  <main class="container">
    <div id="propertyContent">
      <div class="not-found"><h1>Loading property...</h1></div>
    </div>
  </main>

  <footer>
    <p>© 2026 DreamHome Pune. All rights reserved.</p>
    <p>Property information is for demonstration purposes.</p>
  </footer>

  <script>
    const properties = {
      nigdi: {
        id:"nigdi",title:"2 BHK Apartment",location:"Nigdi, Pune",
        type:"Apartment",price:"₹75 Lakhs",bedrooms:2,bathrooms:2,
        area:"1050 sq. ft.",furnishing:"Semi-Furnished",parking:"1 Car Parking",
        description:"A sample 2 BHK apartment concept in Nigdi, suitable for small families and first-time homebuyers.",
        features:["2 Bedrooms","2 Bathrooms","Living Room","Kitchen","Parking","Residential Location"]
      },
      pradhikaran: {
        id:"pradhikaran",title:"3 BHK Premium Apartment",location:"Pradhikaran, Pune",
        type:"Apartment",price:"₹1.15 Crore",bedrooms:3,bathrooms:3,
        area:"1550 sq. ft.",furnishing:"Semi-Furnished",parking:"1 Car Parking",
        description:"A sample spacious 3 BHK apartment concept for families looking for extra living space in Pradhikaran.",
        features:["3 Bedrooms","3 Bathrooms","Spacious Living Room","Modern Kitchen","Parking","Family Home"]
      },
      wakad: {
        id:"wakad",title:"4 BHK Luxury Villa",location:"Wakad, Pune",
        type:"Villa",price:"₹1.45 Crore",bedrooms:4,bathrooms:4,
        area:"2200 sq. ft.",furnishing:"Semi-Furnished",parking:"2 Car Parking",
        description:"A sample villa concept with four bedrooms and generous living space for larger families.",
        features:["4 Bedrooms","4 Bathrooms","Large Living Area","Kitchen","2 Parking Spaces","Villa Layout"]
      },
      ravet: {
        id:"ravet",title:"2 BHK Premium Apartment",location:"Ravet, Pune",
        type:"Apartment",price:"₹68 Lakhs",bedrooms:2,bathrooms:2,
        area:"1000 sq. ft.",furnishing:"Unfurnished",parking:"1 Car Parking",
        description:"A sample 2 BHK apartment concept for buyers exploring homes in Ravet.",
        features:["2 Bedrooms","2 Bathrooms","Living Room","Kitchen","Parking","Apartment Layout"]
      },
      chinchwad: {
        id:"chinchwad",title:"3 BHK Family House",location:"Chinchwad, Pune",
        type:"House",price:"₹95 Lakhs",bedrooms:3,bathrooms:2,
        area:"1650 sq. ft.",furnishing:"Semi-Furnished",parking:"1 Car Parking",
        description:"A sample three-bedroom family house concept with practical living space.",
        features:["3 Bedrooms","2 Bathrooms","Family Living Area","Kitchen","Parking","Independent House"]
      },
      tathawade: {
        id:"tathawade",title:"3 BHK Modern Apartment",location:"Tathawade, Pune",
        type:"Apartment",price:"₹88 Lakhs",bedrooms:3,bathrooms:3,
        area:"1400 sq. ft.",furnishing:"Semi-Furnished",parking:"1 Car Parking",
        description:"A sample modern three-bedroom apartment concept for families seeking additional space.",
        features:["3 Bedrooms","3 Bathrooms","Modern Living Room","Kitchen","Parking","Apartment Layout"]
      }
    };

    const propertyId = new URLSearchParams(location.search).get("id");
    const property = properties[propertyId];
    const content = document.getElementById("propertyContent");

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[char]);
    }

    function getArray(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function saveRecentlyViewed(id) {
      try {
        let ids = getArray("dreamhomeRecentlyViewed");
        ids = ids.filter(item => item !== id);
        ids.unshift(id);
        localStorage.setItem("dreamhomeRecentlyViewed", JSON.stringify(ids.slice(0,10)));
      } catch (error) {
        console.warn("Recently viewed history could not be saved.");
      }
    }

    function renderNotFound() {
      content.innerHTML = `
        <section class="not-found">
          <h1>Property Not Found</h1>
          <p>Please browse the available sample listings and select a property.</p>
          <a class="btn btn-dark" href="properties.html">Browse Properties</a>
        </section>`;
    }

    function renderProperty() {
      if (!property) {
        renderNotFound();
        return;
      }

      document.title = property.title + " | DreamHome Pune";
      saveRecentlyViewed(property.id);

      const favorites = getArray("dreamhomeFavorites");
      const isFavorite = favorites.includes(property.id);

      content.innerHTML = `
        <div class="property-layout">
          <div>
            <div class="image-placeholder" role="img"
              aria-label="${escapeHTML(property.title)}">
              ${escapeHTML(property.title)}<br>${escapeHTML(property.location)}
            </div>

            <section class="description-card">
              <h2>About This Property</h2>
              <p>${escapeHTML(property.description)}</p>
              <p><strong>Location:</strong> ${escapeHTML(property.location)}</p>
              <p><strong>Note:</strong> The price and specifications are sample data, not a verified property offer.</p>
              <h2 style="margin-top:22px">Property Features</h2>
              <div class="features">
                ${property.features.map(feature =>
                  `<div class="feature">✓ ${escapeHTML(feature)}</div>`
                ).join("")}
              </div>
            </section>
          </div>

          <div>
            <section class="details-card">
              <span class="property-type">${escapeHTML(property.type)}</span>
              <h1>${escapeHTML(property.title)}</h1>
              <p class="location">📍 ${escapeHTML(property.location)}</p>
              <div class="price">${escapeHTML(property.price)}</div>

              <div class="quick-facts">
                <div class="fact"><span>Bedrooms</span><strong>${property.bedrooms} BHK</strong></div>
                <div class="fact"><span>Bathrooms</span><strong>${property.bathrooms}</strong></div>
                <div class="fact"><span>Built-up Area</span><strong>${escapeHTML(property.area)}</strong></div>
                <div class="fact"><span>Furnishing</span><strong>${escapeHTML(property.furnishing)}</strong></div>
                <div class="fact"><span>Parking</span><strong>${escapeHTML(property.parking)}</strong></div>
                <div class="fact"><span>Property Type</span><strong>${escapeHTML(property.type)}</strong></div>
              </div>

              <div class="actions">
                <a class="btn btn-dark" href="contact-owner.html?id=${encodeURIComponent(property.id)}">Contact Us</a>
                <button class="btn btn-outline" id="favoriteButton" type="button">
                  ${isFavorite ? "♥ Remove Favorite" : "♡ Add to Favorites"}
                </button>
                <a class="btn btn-outline" href="properties.html">Back to Properties</a>
              </div>
            </section>

            <section class="contact-card">
              <h2>Interested in This Property?</h2>
              <p>Open the enquiry form to prefill this property's details.</p>
              <a class="btn btn-dark" href="contact-owner.html?id=${encodeURIComponent(property.id)}">Enquire About This Property</a>
              <p class="notice">Sample listing. Verify all property information independently.</p>
            </section>
          </div>
        </div>`;

      document.getElementById("favoriteButton").addEventListener("click", () => {
        let current = getArray("dreamhomeFavorites");

        if (current.includes(property.id)) {
          current = current.filter(id => id !== property.id);
        } else {
          current.push(property.id);
        }

        try {
          localStorage.setItem("dreamhomeFavorites", JSON.stringify(current));
          renderProperty();
        } catch (error) {
          alert("Could not update favorites in this browser.");
        }
      });
    }

    renderProperty();
  </script>
</body>
</html>
