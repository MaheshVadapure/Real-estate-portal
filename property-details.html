<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #174a8b;
      --primary-dark: #103563;
      --accent: #f5a623;
      --background: #f5f7fb;
      --surface: #fff;
      --text: #202938;
      --muted: #687386;
      --border: #e2e7ef;
      --danger: #dc3545;
      --shadow: 0 8px 24px rgba(25,45,75,.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    header {
      background: white;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .navbar {
      min-height: 74px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: var(--primary);
      white-space: nowrap;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 700;
      color: #465267;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .breadcrumb {
      padding: 22px 0 15px;
      color: var(--muted);
      font-size: 13px;
    }

    .breadcrumb a {
      color: var(--primary);
      font-weight: 700;
    }

    main {
      padding-bottom: 65px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 25px;
    }

    .page-heading h1 {
      font-size: clamp(27px, 4vw, 36px);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .location {
      color: var(--muted);
      font-size: 14px;
    }

    .price {
      color: var(--primary);
      font-size: clamp(25px, 3vw, 32px);
      font-weight: 800;
      white-space: nowrap;
    }

    .gallery {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(230px, 1fr);
      gap: 14px;
      margin-bottom: 30px;
    }

    .main-photo {
      position: relative;
      height: 440px;
      background: #e5eaf1;
      border-radius: 14px;
      overflow: hidden;
    }

    .main-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
    }

    .photo-count {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(12,30,53,.82);
      color: white;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.94);
      color: var(--primary);
      font-size: 24px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }

    .gallery-arrow:hover {
      background: white;
    }

    .gallery-arrow.previous {
      left: 13px;
    }

    .gallery-arrow.next {
      right: 13px;
    }

    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 12px;
      min-height: 0;
    }

    .thumbnail {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
      padding: 0;
      border: 3px solid transparent;
      border-radius: 10px;
      overflow: hidden;
      background: #e5eaf1;
      cursor: pointer;
    }

    .thumbnail img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 120px;
      object-fit: cover;
      transition: transform .2s;
    }

    .thumbnail:hover img {
      transform: scale(1.04);
    }

    .thumbnail.active {
      border-color: var(--primary);
    }

    .thumbnail.active::after {
      content: "Viewing";
      position: absolute;
      bottom: 7px;
      left: 7px;
      background: var(--primary);
      color: white;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 10px;
    }

    .gallery-help {
      margin-top: -17px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 12px;
    }

    .content-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(270px, .9fr);
      gap: 25px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 25px;
      margin-bottom: 22px;
      box-shadow: 0 3px 12px rgba(25,45,75,.03);
    }

    .panel h2 {
      font-size: 22px;
      margin-bottom: 17px;
    }

    .panel p {
      color: #596477;
      font-size: 14px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .feature {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 13px;
      background: #f7f9fc;
      border-radius: 8px;
    }

    .feature-icon {
      font-size: 23px;
    }

    .feature strong {
      display: block;
      font-size: 14px;
    }

    .feature span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .amenities {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .amenity {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fafbfd;
      font-size: 13px;
    }

    .sidebar .panel {
      position: sticky;
      top: 95px;
    }

    .sidebar-price {
      font-size: 29px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .sidebar-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .detail-row span:first-child {
      color: var(--muted);
    }

    .detail-row strong {
      text-align: right;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      margin-top: 13px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      border: 1px solid var(--primary);
      background: white;
      color: var(--primary);
    }

    .btn-outline:hover {
      background: #edf4ff;
    }

    .favorite-button.active {
      color: var(--danger);
      border-color: var(--danger);
      background: #fff4f5;
    }

    .notice {
      background: #fff8e8;
      color: #79551a;
      border: 1px solid #f4dfac;
      padding: 13px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 18px;
    }

    .not-found {
      background: white;
      padding: 45px 25px;
      border-radius: 13px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .not-found h1 {
      margin-bottom: 10px;
    }

    .not-found p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .not-found a {
      display: inline-flex;
      padding: 11px 18px;
      border-radius: 7px;
      color: white;
      background: var(--primary);
    }

    footer {
      background: #0c1e35;
      color: white;
      text-align: center;
      padding: 27px 0;
      font-size: 13px;
    }

    footer p {
      color: #c4cfde;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 100;
      display: none;
      background: #172b45;
      color: white;
      padding: 13px 18px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      font-size: 14px;
    }

    .toast.show {
      display: block;
    }

    /* Full-screen photo preview */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4,12,24,.94);
      padding: 25px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 6px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 25px;
      border: none;
      background: transparent;
      color: white;
      font-size: 36px;
      cursor: pointer;
    }

    .lightbox-caption {
      position: absolute;
      bottom: 20px;
      color: white;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      .main-photo {
        height: 390px;
      }

      .thumbnail-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: 115px;
      }

      .content-layout {
        grid-template-columns: 1fr;
      }

      .sidebar .panel {
        position: static;
      }
    }

    @media (max-width: 600px) {
      .navbar {
        padding: 14px 0;
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        gap: 12px 17px;
      }

      .nav-links a {
        font-size: 12px;
      }

      .page-heading {
        flex-direction: column;
      }

      .main-photo {
        height: 280px;
      }

      .thumbnail-grid {
        gap: 7px;
        grid-template-rows: 85px;
      }

      .thumbnail img {
        min-height: 80px;
      }

      .panel {
        padding: 19px;
      }

      .features-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function readStorage(key) {
      try {
        const result = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(result) ? result : [];
      } catch {
        return [];
      }
    }

    function saveStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (error) {
        console.error("Storage error:", error);
        showToast("Unable to save changes in this browser.");
        return false;
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimeout);

      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    function formatIndianPrice(price) {
      return "₹" + Number(price).toLocaleString("en-IN");
    }

    function getPropertyIdFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function addToRecentlyViewed(propertyId) {
      const ids = readStorage(RECENT_KEY).map(String);
      const updated = [
        propertyId,
        ...ids.filter(id => id !== propertyId)
      ].slice(0, 10);

      saveStorage(RECENT_KEY, updated);
    }

    function getFavorites() {
      return readStorage(FAVORITES_KEY).map(String);

        <div class="page-heading">
          <div>
            <h1>${escapeHTML(property.title)}</h1>
            <p class="location">
              📍 ${escapeHTML(property.location)}, Pune, Maharashtra
            </p>
          </div>

          <div class="price">${escapeHTML(property.priceText)}</div>
        </div>

        <section class="gallery" aria-label="Property photo gallery">
          <div class="main-photo">
            <img
              id="mainPropertyImage"
              src="${escapeHTML(property.images[0])}"
              alt="${escapeHTML(property.title)} - Photo 1"
              title="Click to enlarge photo"
            >

            <button
              type="button"
              class="gallery-arrow previous"
              id="previousPhoto"
              aria-label="Previous photo"
            >‹</button>

            <button
              type="button"
              class="gallery-arrow next"
              id="nextPhoto"
              aria-label="Next photo"
            >›</button>

            <span class="photo-count" id="photoCount">Photo 1 of ${property.images.length}</span>
          </div>

          <div class="thumbnail-grid" id="thumbnailGrid">
            ${property.images.map((image, index) => `
              <button
                type="button"
                class="thumbnail ${index === 0 ? "active" : ""}"
                data-photo-index="${index}"
                aria-label="View photo ${index + 1}"
                aria-pressed="${index === 0}"
              >
                <img
                  src="${escapeHTML(image)}"
                  alt="Property thumbnail ${index + 1}"
                  loading="lazy"
                >
              </button>
            `).join("")}
          </div>
        </section>

        <p class="gallery-help">
          Select a thumbnail or use the arrows to browse the property photos.
          Click the main photo to view it larger.
        </p>

        <div class="content-layout">
          <div>
            <section class="panel">
              <h2>Property Overview</h2>
              <p>${escapeHTML(property.description)}</p>
            </section>

            <section class="panel">
              <h2>Property Features</h2>

              <div class="features-grid">
                <div class="feature">
                  <span class="feature-icon">🛏️</span>
                  <div>
                    <strong>${property.bedrooms} Bedrooms</strong>
                    <span>Bedroom configuration</span>
                  </div>
                </div>

                <div class="feature">
                  <span class="feature-icon">🛁</span>
                  <div>
                    <strong>${property.bathrooms} Bathrooms</strong>
                    <span>Bathroom configuration</span>
                  </div>
                </div>

                <div class="feature">
                  <span class="feature-icon">📐</span>
                  <div>
                    <strong>${escapeHTML(property.area)}</strong>
                    <span>Listed area; verify actual area</span>
                  </div>
                </div>

                <div class="feature">
                  <span class="feature-icon">🏠</span>
                  <div>
                    <strong>${escapeHTML(property.type)}</strong>
                    <span>Property type</span>
                  </div>
                </div>
              </div>
            </section>

            <section class="panel">
              <h2>Amenities</h2>

              <div class="amenities">
                ${property.amenities.map(item => `
                  <span class="amenity">✓ ${escapeHTML(item)}</span>
                `).join("")}
              </div>
            </section>

            <section class="panel">
              <h2>Location</h2>
              <p>
                ${escapeHTML(property.location)}, Pune, Maharashtra.
                Please confirm the exact property address with the contact
                before arranging a visit.
              </p>

              <a
                class="btn btn-outline"
                style="max-width:260px"
                href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(property.location + ", Pune, Maharashtra")}"
                target="_blank"
                rel="noopener noreferrer"
              >Explore Area on Maps ↗</a>
            </section>
          </div>

          <aside class="sidebar">
            <section class="panel">
              <div class="sidebar-price">${escapeHTML(property.priceText)}</div>
              <p class="sidebar-subtitle">Listed sample price</p>

              <div class="detail-row">
                <span>Property ID</span>
                <strong>${escapeHTML(property.id.toUpperCase())}</strong>
              </div>

              <div class="detail-row">
                <span>Location</span>
                <strong>${escapeHTML(property.location)}</strong>
              </div>

              <div class="detail-row">
                <span>Type</span>
                <strong>${escapeHTML(property.type)}</strong>
              </div>

              <div class="detail-row">
                <span>Bedrooms</span>
                <strong>${property.bedrooms} BHK</strong>
              </div>

              <div class="detail-row">
                <span>Bathrooms</span>
                <strong>${property.bathrooms}</strong>
              </div>

              <div class="detail-row">
                <span>Area</span>
                <strong>${escapeHTML(property.area)}</strong>
              </div>

              <div class="detail-row">
                <span>Furnishing</span>
                <strong>${escapeHTML(property.furnishing)}</strong>
              </div>

              <div class="detail-row">
                <span>Parking</span>
                <strong>${escapeHTML(property.parking)}</strong>
              </div>

              <a
                class="btn btn-primary"
                href="contact-owner.html?id=${encodeURIComponent(property.id)}"
              >Enquire About This Property</a>

              <button
                type="button"
                class="btn btn-outline favorite-button ${isFavorite ? "active" : ""}"
                id="favoriteToggle"
                aria-pressed="${isFavorite}"
              >${isFavorite ? "♥ Remove from Favorites" : "♡ Add to Favorites"}</button>

              <a class="btn btn-outline" href="properties.html">
                ← Back to Properties
              </a>

              <div class="notice">
                Demo project: price, photographs, features and availability
                are sample information and have not been independently verified.
              </div>
            </section>
          </aside>
        </div>
      `;

      attachGalleryEvents();
      attachFavoriteEvent();
    }

    function updateMainPhoto(index) {
      if (!currentProperty) return;

      const total = currentProperty.images.length;
      currentImageIndex = (index + total) % total;

      const mainImage = document.getElementById("mainPropertyImage");
      const photoCount = document.getElementById("photoCount");
      const thumbnails = document.querySelectorAll("[data-photo-index]");

      mainImage.src = currentProperty.images[currentImageIndex];
      mainImage.alt = currentProperty.title +
        " - Photo " + (currentImageIndex + 1);

      photoCount.textContent =
        "Photo " + (currentImageIndex + 1) + " of " + total;

      thumbnails.forEach((thumbnail, thumbnailIndex) => {
        const active = thumbnailIndex === currentImageIndex;
        thumbnail.classList.toggle("active", active);
        thumbnail.setAttribute("aria-pressed", String(active));
      });
    }

    function attachGalleryEvents() {
      document.getElementById("previousPhoto").addEventListener("click", () => {
        updateMainPhoto(currentImageIndex - 1);
      });

      document.getElementById("nextPhoto").addEventListener("click", () => {
        updateMainPhoto(currentImageIndex + 1);
      });

      document.getElementById("thumbnailGrid").addEventListener("click", event => {
        const thumbnail = event.target.closest("[data-photo-index]");
        if (!thumbnail) return;

        updateMainPhoto(Number(thumbnail.dataset.photoIndex));
      });

      document.getElementById("mainPropertyImage").addEventListener("click", openLightbox);
    }

    function openLightbox() {
      if (!currentProperty) return;

      const lightbox = document.getElementById("lightbox");
      const image = document.getElementById("lightboxImage");
      const caption = document.getElementById("lightboxCaption");

      image.src = currentProperty.images[currentImageIndex];
      image.alt = currentProperty.title + " - enlarged photo";
      caption.textContent =
        currentProperty.title + " · Photo " +
        (currentImageIndex + 1) + " of " +
        currentProperty.images.length;

      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.getElementById("closeLightbox").focus();
    }

    function closeLightbox() {
      const lightbox = document.getElementById("lightbox");
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeLightbox").addEventListener("click", closeLightbox);

    document.getElementById("lightbox").addEventListener("click", event => {
      if (event.target.id === "lightbox") closeLightbox();
    });

    document.addEventListener("keydown", event => {
      const lightboxOpen = document.getElementById("lightbox")
        .classList.contains("open");

      if (event.key === "Escape" && lightboxOpen) {
        closeLightbox();
      }

      if (lightboxOpen && event.key === "ArrowLeft") {
        updateMainPhoto(currentImageIndex - 1);
        openLightbox();
      }

      if (lightboxOpen && event.key === "ArrowRight") {
        updateMainPhoto(currentImageIndex + 1);
        openLightbox();
      }
    });

    function attachFavoriteEvent() {
      document.getElementById("favoriteToggle").addEventListener("click", () => {
        if (!currentProperty) return;

        const favorites = getFavorites();
        const alreadyFavorite = favorites.includes(currentProperty.id);

        const updated = alreadyFavorite
          ? favorites.filter(id => id !== currentProperty.id)
          : [...favorites, currentProperty.id];

        if (!saveStorage(FAVORITES_KEY, updated)) return;

        const button = document.getElementById("favoriteToggle");

        button.classList.toggle("active", !alreadyFavorite);
        button.setAttribute("aria-pressed", String(!alreadyFavorite));
        button.textContent = alreadyFavorite
          ? "♡ Add to Favorites"
          : "♥ Remove from Favorites";

        showToast(
          alreadyFavorite
            ? "Removed from favorites."
            : "Added to favorites."
        );
      });
    }

    function renderNotFound() {
      document.title = "Property Not Found | DreamHome Pune";

      propertyPage.innerHTML = `
        <div class="not-found">
          <h1>Property Not Found</h1>
          <p>
            We couldn't find that property. Please return to the property
            listings and select a valid property.
          </p>
          <a href="properties.html">Browse Properties</a>
        </div>
      `;
    }

    function init() {
      document.getElementById("currentYear").textContent =
        new Date().getFullYear();

      const propertyId = getPropertyIdFromURL();
      currentProperty = properties[propertyId];

      if (!currentProperty) {
        renderNotFound();
        return;
      }

      addToRecentlyViewed(currentProperty.id);
      renderProperty(currentProperty);
    }

    init();
  </script>
</body>
</html>
