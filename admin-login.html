<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet"

href="style.css">

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<div class="container">

<div class="logo">

<i class="fa-solid fa-house"></i>

DreamHome Admin

</div>

</div>

</header>

<div class="form-container">

<h2>Admin Login</h2>

<form>

<div class="form-group">

<label>Admin ID</label>

<input
type="text"
id="adminId"
placeholder="Enter Admin ID">

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="adminPassword"
placeholder="Enter Password">

</div>

<button

type="button"

class="submit-btn"

onclick="adminLogin()">

Login

</button>

</form>

</div>

<script src="script.js"></script>

</body>

</html>
