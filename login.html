<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | DreamHome</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        .auth-page {
            min-height: 80vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 20px;
        }

        .auth-card {

            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.12);

        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header i {
            font-size: 42px;
            color: #0ea5e9;
            margin-bottom: 12px;
        }

        .auth-header h1 {
            color: #0f172a;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {

            width: 100%;

            padding: 13px 45px 13px 13px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            box-sizing: border-box;
        }

        .input-wrapper input:focus {
            border-color: #0ea5e9;
        }

        .input-icon {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            color: #64748b;
        }

        .remember-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #475569;
        }

        .remember input {
            accent-color: #0ea5e9;
        }

        .auth-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #0ea5e9;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        .auth-btn:hover {
            background: #0284c7;
        }

        .error-message {

            display: none;

            background: #fee2e2;

            color: #b91c1c;

            padding: 11px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .success-message {

            display: none;

            background: #dcfce7;

            color: #15803d;

            padding: 11px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .auth-footer {

            text-align: center;

            margin-top: 22px;

            color: #64748b;
        }

        .auth-footer a {

            color: #0ea5e9;

            font-weight: 600;
        }

        @media(max-width:500px) {

            .auth-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="container">

            <div class="logo">

                <i class="fa-solid fa-house"></i>

                DreamHome

            </div>

            <nav>

                <ul>

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="properties.html">
                            Properties
                        </a>
                    </li>

                    <li>
                        <a href="register.html">
                            Register
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- LOGIN -->

    <main class="auth-page">

        <div class="auth-card">


            <div class="auth-header">

                <i class="fa-solid fa-right-to-bracket"></i>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to access your DreamHome account.
                </p>

            </div>


            <div
                id="errorMessage"
                class="error-message">
            </div>


            <div
                id="successMessage"
                class="success-message">
            </div>


            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                        <i
                            class="fa-solid fa-eye input-icon"
                            id="togglePassword"
                            onclick="togglePassword()">
                        </i>

                    </div>

                </div>


                <!-- REMEMBER -->

                <div class="remember-row">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        Remember Me

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>


            </form>


            <div class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-content">

            <h2>
                DreamHome
            </h2>

            <p>
                Your trusted partner for buying,
                selling, and renting properties.
            </p>

            <p>
                © 2026 DreamHome. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="script.js"></script>


    <script>

        /* =========================
           SHOW / HIDE PASSWORD
        ========================= */

        function togglePassword() {

            let password =
                document.getElementById(
                    "password"
                );

            let icon =
                document.getElementById(
                    "togglePassword"
                );


            if (
                password.type ===
                "password"
            ) {

                password.type = "text";

                icon.classList.remove(
                    "fa-eye"
                );

                icon.classList.add(
                    "fa-eye-slash"
                );

            } else {

                password.type =
                    "password";

                icon.classList.remove(
                    "fa-eye-slash"
                );

                icon.classList.add(
                    "fa-eye"
                );

            }

        }


        /* =========================
           LOGIN
        ========================= */

        document.getElementById("loginForm")
            .addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();


                    let email =
                        document.getElementById(
                            "email"
                        ).value
                        .trim()
                        .toLowerCase();


                    let password =
                        document.getElementById(
                            "password"
                        ).value;


                    let remember =
                        document.getElementById(
                            "rememberMe"
                        ).checked;


                    let error =
                        document.getElementById(
                            "errorMessage"
                        );

                    let success =
                        document.getElementById(
                            "successMessage"
                        );


                    error.style.display =
                        "none";

                    success.style.display =
                        "none";


                    /* EMAIL VALIDATION */

                    let emailPattern =
                        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                    if (
                        !emailPattern.test(email)
                    ) {

                        error.textContent =
                            "Please enter a valid email address.";

                        error.style.display =
                            "block";

                        return;

                    }


                    if (!password) {

                        error.textContent =
                            "Please enter your password.";

                        error.style.display =
                            "block";

                        return;

                    }


                    /* GET USERS */

                    let users =
                        JSON.parse(
                            localStorage.getItem(
                                "users"
                            )
                        ) || [];


                    /* FIND USER */

                    let user =
                        users.find(
                            function (item) {

                                return (
                                    item.email ===
                                    email &&
                                    item.password ===
                                    password
                                );

                            }
                        );


                    if (!user) {

                        error.textContent =
                            "Invalid email or password.";

                        error.style.display =
                            "block";

                        return;

                    }


                    /* SAVE CURRENT USER */

                    localStorage.setItem(
                        "currentUser",
                        JSON.stringify(user)
                    );


                    /* REMEMBER ME */

                    if (remember) {

                        localStorage.setItem(
                            "rememberMe",
                            "true"
                        );

                    } else {

                        localStorage.removeItem(
                            "rememberMe"
                        );

                    }


                    success.textContent =
                        "Login successful! Redirecting...";

                    success.style.display =
                        "block";


                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        1000
                    );

                }
            );

    </script>

</body>

</html>
