<section class="properties">

<h2>Available Properties</h2>

<div class="search-box">

<select id="filterCategory">

<option value="">All Property Types</option>

<option value="Apartment">Apartment</option>

<option value="Villa">Villa</option>

<option value="House">House</option>

<option value="Commercial">Commercial</option>

<option value="Land">Land</option>

</select>

<button onclick="filterProperties()">

Filter

</button>

</div>

<br>

<div class="property-grid">

<!-- Property 1 -->

<div class="card property-card"

data-category="Villa">

<img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=600">

<h3>Luxury Villa</h3>

<p>Los Angeles</p>

<p class="price">$350,000</p>

<button class="card-btn"

onclick="viewProperty('Luxury Villa','$350,000','Los Angeles','https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=600')">

View Details

</button>

</div>

<!-- Property 2 -->

<div class="card property-card"

data-category="Apartment">

<img src="https://images.unsplash.com/photo-1460317442991-0ec209397118?w=600">

<h3>Modern Apartment</h3>

<p>New York</p>

<p class="price">$220,000</p>

<button class="card-btn"

onclick="viewProperty('Modern Apartment','$220,000','New York','https://images.unsplash.com/photo-1460317442991-0ec209397118?w=600')">

View Details

</button>

</div>

<!-- Property 3 -->

<div class="card property-card"

data-category="House">

<p>Chicago</p>

<p class="price">$420,000</p>

onclick="viewProperty('Family House','$420,000','Chicago','https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=600')">

View Details

</button>

</div>
