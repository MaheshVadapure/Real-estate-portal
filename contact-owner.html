<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Contact Owner</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<div class="container">

<div class="logo">

<i class="fa-solid fa-house"></i>

DreamHome

</div>

<nav>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="properties.html">Properties</a></li>

<li><a href="favorites.html">Favorites</a></li>

</ul>

</nav>

</div>

</header>

<div class="form-container">

<h2>Contact Property Owner</h2>

<form>

<div class="form-group">

<label>Name</label>

<input
type="text"
id="contactName"
placeholder="Enter Name">

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="contactEmail"
placeholder="Enter Email">

</div>

<div class="form-group">

<label>Phone</label>

<input
type="text"
id="contactPhone"
placeholder="Enter Phone Number">

</div>

<div class="form-group">

<label>Message</label>

<textarea
id="contactMessage"
rows="5"
placeholder="Write your inquiry"></textarea>

</div>

<button
type="button"
class="submit-btn"
onclick="sendInquiry()">

Send Inquiry

</button>

</form>

</div>

<script src="script.js"></script>

</body>

</html>
